CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SLEEP=n

# The dongle owns the link to the host, so it benefits most from the
# connection stability changes slated to become ZMK defaults.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

### DONGLE MODE
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Report the halves' battery levels to the host. Without this the host only
# sees the dongle, which is USB powered and tells you nothing.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
