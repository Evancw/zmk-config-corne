# Uncomment the following lines to enable the Corne RGB Underglow
#CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_WS2812_STRIP=y
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
#CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# Uncomment the following line to enable the Corne OLED Display
#CONFIG_ZMK_DISPLAY=n

# Define debouncing behavior
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=2
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=4

# NOTE: this file is shared - ZMK loads it for corne_left, corne_right AND
# corne_dongle (it strips the _suffix to find a base-name .conf). Put
# half-only settings in corne_left/right.conf, dongle-only in corne_dongle.conf.
# TX power boost now lives in corne_dongle.conf only: the dongle drives the
# long link to the host, the halves only need to reach the dongle.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_KEYBOARD_NAME="CorneWireless"
# ZMK Studio is deliberately not set here: it only works on the central, and
# only with the studio-rpc-usb-uart snippet, which build.yaml applies to the
# dongle alone. Setting it here just bloated both halves. The dongle enables it
# via -DCONFIG_ZMK_STUDIO=y in build.yaml.
# mouse
CONFIG_ZMK_POINTING=y
