# Uncomment the following lines to enable the Corne RGB Underglow
#CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_WS2812_STRIP=y
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
#CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# Uncomment the following line to enable the Corne OLED Display
#CONFIG_ZMK_DISPLAY=n

# Debounce lives in corne_left/right.conf, which already set the same values.
# Setting it here too reached the dongle, which uses mock_kscan and has no
# matrix, producing two "unsatisfied dependencies: ZMK_KSCAN_GPIO_DRIVER (=n)"
# warnings on every dongle build.

# NOTE: this file is shared - ZMK loads it for corne_left, corne_right AND
# corne_dongle (it strips the _suffix to find a base-name .conf). Put
# half-only settings in corne_left/right.conf, dongle-only in corne_dongle.conf.
# TX power boost now lives in corne_dongle.conf only: the dongle drives the
# long link to the host, the halves only need to reach the dongle.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_KEYBOARD_NAME="CorneWireless"
# ZMK Studio is deliberately not set here: it only works on the central. Setting
# it in this shared file did set the symbol on the halves, but ZMK only selects
# ZMK_STUDIO_RPC when central, so no Studio code ever compiled there - it cost
# zero bytes (verified: peripheral FLASH was byte-identical before and after
# removing it). Kept out for clarity, not size. The dongle enables Studio via
# -DCONFIG_ZMK_STUDIO=y in build.yaml.
# mouse
CONFIG_ZMK_POINTING=y
